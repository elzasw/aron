# ARON 2 CI - build + test gate (packaging/deploy jobs come later, see PLAN.md).

variables:
  MAVEN_CLI_OPTS: "-U --batch-mode --errors --fail-at-end --show-version"
  MAVEN_OPTS: "-Dmaven.repo.local=/cache/.m2/repository"

stages:
  - build

build:
  stage: build
  image: $CI_REGISTRY/lightcomp/docker-images/jdk25-nodejs26:latest
  tags:
    - docker
  script:
    - mvn $MAVEN_CLI_OPTS install
  artifacts:
    # The deployable bundle (executable Spring Boot fat jar).
    paths:
      - distribution/target/aron2.jar
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
