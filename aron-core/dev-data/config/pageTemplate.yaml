#
# Seznam dostupnych prekladu
#
# V pripade jednoho nebo zadneho jazyku
# se nezobrazi vyber
#
localizations:
  - cs_CZ
  - en_US

# Odkazy v paticce portalu (typovane, viz doc/accessibility.md).
# Znama role (code) se popisuje sama v jazyce ctenare, volny odkaz ma label -
# jeden retezec, nebo mapu jazyk -> text.
footer:
  links:
    - code: ACCESSIBILITY
      url: http://localhost/pristupnost
    - url: mailto:webmaster@example.com
      label:
        cs: Kontakt
        en: Contact

# Nazev systemu
# Lze pouzit pro pojmenovani zalozky,
# zobrazuje vpravo od ikony systému
name: ARchiv ONline

homepage:
  # Dev ukazka vsech moznosti dlazdic. Fazety, ikony vysledku i zastupne obrazky
  # dlazdic (home-*.svg) se berou ze SPOLECNE ceske konfigurace; dev navic pridava
  # vlastni adresar ./dev-data/config/images se znackou odkazu (demo-mark.svg),
  # ktera se do nasazeni nedodava - webResources.resultImages proto uvadi oba,
  # presne jako nasazeni, ktere si drzi vlastni obrazky mimo balik.
  groups:
    # GRID: obrazkove dlazdice. Prvni je "hero" pres 2x2 pole, dalsi pres 2x1,
    # posledni bez obrazku - nese hlavni barvu portalu, takze skupina drzi tvar
    # i kdyz nasazeni obrazek nedoda.
    - label: { cs: Mohlo by vás zajímat, en: You might be interested in }
      style: GRID
      tiles:
        - label: { cs: Matriky, en: Parish registers }
          note: { cs: církevní i civilní, en: church and civil }
          image: { name: home-matriky.svg }
          columnSpan: 2
          rowSpan: 2
          apuType: ARCH_DESC
          filters:
            - facet: UNIT_DATE
              from: 1800
              to: 1850
        - label: { cs: Mapy a plány, en: Maps and plans }
          # vyrez: subjekt je vlevo dole, proto se drzi tam
          image: { name: home-mapy.svg, positionX: left, positionY: bottom }
          columnSpan: 2
          apuType: ARCH_DESC
        - label: { cs: Kroniky, en: Chronicles }
          image: { name: home-kroniky.svg }
          columnSpan: 2
          apuType: ARCH_DESC
        - label: { cs: Fotografie, en: Photographs }
          note: { cs: města a obce, en: towns and villages }
          image: { name: home-fotografie.svg, positionY: top }
          columnSpan: 2
          apuType: ARCH_DESC
        - label: { cs: Archivní soubory, en: Funds }
          note: { cs: bez obrázku - hlavní barva portálu, en: no picture - the portal colour }
          columnSpan: 2
          apuType: FUND

    # LIST: radky odkazu. Znacka (image) je tu mala, vedle popisu - stejny klic
    # jako u obrazkove dlazdice, jen jinak vykresleny.
    - label: { cs: Jiné zdroje, en: Other sources }
      style: LIST
      tiles:
        - label: Porta fontium
          note: { cs: česko-bavorská digitální knihovna, en: Czech-Bavarian digital library }
          image: { name: demo-mark.svg }
          url: https://www.portafontium.eu
        - label: { cs: Archiválie z první poloviny 19. století, en: Records of the early 19th century }
          note: { cs: datace 1800-1850, en: dated 1800-1850 }
          apuType: ARCH_DESC
          filters:
            - facet: UNIT_DATE
              from: 1800
              to: 1850
        - label: { cs: Napište nám, en: Write to us }
          image: { name: demo-mark.svg }
          url: "mailto:webmaster@example.com"

  # Pas na konci uvodni strany - nahrada za footerCenter / footerRight stareho
  # portalu, ktere nesly HTML z konfigurace. Odkaz uvnitr vety se zapisuje
  # zastupnym jmenem a doplni se v links daneho odstavce.
  footer:
    columns:
      - heading: { cs: Základní informace, en: About }
        paragraphs:
          - text:
              cs: "Prezentační web ARchiv ONline je webová aplikace {archiv} sloužící ke zpřístupnění popisu archiválií a jejich digitalizátů."
              en: "ARchiv ONline is a web application of the {archiv}, presenting archival descriptions and their digitised images."
            links:
              archiv:
                label:
                  cs: Státního oblastního archivu v Zámrsku
                  en: State Regional Archives in Zamrsk
                url: https://vychodoceskearchivy.cz/
          - text:
              cs: "© 2026 Státní oblastní archiv v Zámrsku | {portal} · {porta}"
              en: "© 2026 State Regional Archives in Zamrsk | {portal} · {porta}"
            links:
              portal:
                label: vychodoceskearchivy.cz
                url: https://vychodoceskearchivy.cz/
              porta:
                label: portafontium.eu
                url: https://www.portafontium.eu
      - heading: { cs: Kontakt, en: Contact }
        links:
          - label: webmaster@example.com
            url: "mailto:webmaster@example.com"
          # znama role: popis dodava PORTAL v jazyce ctenare, konfigurace zadny
          # nepise - proto tu neni label. Povinne odkazy (prohlaseni o
          # pristupnosti) ale patri do footer.links vyse, aby byly videt vsude.
          - code: CONTACT
            url: https://example.org/kontakt
          # znacka u odkazu: soubor nasazeni, ne jmeno, ktere by znal portal -
          # prejmenovana sit (z Twitteru se stalo X) je vymena souboru
          - label: { cs: Archiv na sociální síti, en: The archive's social profile }
            url: https://example.org/social
            image: { name: demo-mark.svg }
