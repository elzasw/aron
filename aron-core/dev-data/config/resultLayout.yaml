# Layout of the structured search results. The codes are the source system's own
# vocabulary - here they come from the <result> elements in
# dev-data/import/arch-desc-1820 (the same codes the MZA deployment uses).
fieldSeparator: " | "
iconSize: 32
icons:
  - code: A_IB
    image: archival-item-book.svg
  - code: A_IM
    image: archival-item-matrika.svg
fields:
  - code: N
    heading: true
    scale: 1.15
    bold: true
  - code: D
    color: "#1a1a1a"
    bold: true
  - code: J_IC
    prefix: "Inv. č.: "
    image: J_IC.svg
  - code: J_UC
    prefix: "Uložení: "
    image: J_UC.svg
  - code: J_I
    label: "Archiv"
    image: J_I.svg
  - code: J_F
    label: "Archivní soubor"
    image: J_F.svg
  - code: J_C
    label: "Nadřazená jednotka"
    image: J_C.svg
