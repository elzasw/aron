spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_UPPER=false;NON_KEYWORDS=VALUE,ORDER
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  liquibase:
    enabled: false
  elasticsearch:
    rest:
      uris: http://localhost:9200

types-config: "./config/types.yaml"
transformation-agent-url: "http://localhost:8088/ws/ApuTransformManager"

files:
  storage: ./target/test-data/fileStorage
  transfer:
    path: ./target/test-data/aronFileTransfer

tile:
  folder: ./target/test-data/tiles
  format: jpg

webResources:
  pageTemplate: ./config/pageTemplate.yaml
  news: ./config/news.yaml
  favoriteQueries: ./config/favoriteQueries.yaml
  facets: ./config/searchConfig.yaml
  logo: ./config/images/logo.svg
  topImage: ./config/images/book.png

help-url: http://localhost
