facets:
  # no when-condition = applies to every apuType
  - type: ENUM
    source: TEST_FACET
    title: Test facet
    maxItems: 10
    displayedItems: 5
    maxDisplayedItems: 10
  # typed facets of the ARCH_DESC section (used by NewApiV1Test)
  - when:
      apuType: ARCH_DESC
    type: FULLTEXT
    source: TITLE_MAIN
    tooltip: Zadejte část názvu
  - when:
      apuType: ARCH_DESC
    type: ENUM
    source: LANG_CODE
    orderBy: ASC
  - when:
      apuType: ARCH_DESC
    type: UNITDATE
    source: UNIT_DATE
  - when:
      apuType: ARCH_DESC
    type: MULTI_REF
    source: REL_ENTITY
  # ENUM facet over an APU_REF source (the institution-facet pattern of real
  # deployments): buckets must carry labels, not raw uuids
  - when:
      apuType: FUND
    type: ENUM
    source: REL_ENTITY
  # the compound condition the shipped config uses for its register facets: a
  # section plus a dependency on another facet's selection. Reading only the
  # simple form advertised such facets for every section (FacetScopeTest).
  - when:
      all:
        - apuType: ARCH_DESC
        - filter: LANG_CODE
          value: v1-cze
    type: ENUM
    source: DEPENDENT_FACET
  # explicit bucket order: the values an archive wants offered first, which
  # frequency would bury. Names a leading run only - the rest follows orderBy.
  - when:
      apuType: ARCH_DESC
    type: ENUM
    source: ORDERED_CODE
    order:
      - zzz-last-by-name
      - mmm-middle
