partTypes:
  - code: PT_TITLE
    name: Title
    viewType: STANDALONE
  - code: PT_BODY
    name: Body
    viewType: GROUPED
itemTypes:
  - code: TITLE_MAIN
    name: Main title
    type: STRING
    indexed: true
  - code: UNIT_DATE
    name: Dating
    type: UNITDATE
    indexed: true
  # ENUM values arrive from Transfagent as display text (APUX ItemEnum is a plain
  # string, no code/label pair) - the terse values in these fixtures are just
  # short test data, not codes the portal would have to resolve.
  - code: LANG_CODE
    name: Language
    type: ENUM
    indexed: true
  - code: CNT_ITEMS
    name: Item count
    type: INTEGER
    indexed: true
  - code: REL_ENTITY
    name: Related entity
    type: APU_REF
    indexed: true
  - code: NOTE_SECRET
    name: Note excluded from the index
    type: STRING
    indexed: false
  - code: INT_NAME_INDEX
    name: Indexed name override
    type: STRING
    indexed: true
  - code: LINK_SOURCE
    name: Source link
    type: LINK
    indexed: false
  - code: NAME_ALT
    name: Variant name form
    type: STRING
    indexed: true
    nameVariant: true
  - code: NOTE_NOFT
    name: Indexed note excluded from the general fulltext
    type: STRING
    indexed: true
    fulltext: false
metaDataTypes:
  - code: MD_ORDER
    name: Order
itemGroups:
  - code: GRP_TITLES
    items:
      - TITLE_MAIN
  - code: GRP_RELS
    items:
      - REL_ENTITY
