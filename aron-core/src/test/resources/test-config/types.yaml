partTypes:
  - code: PT_TITLE
    name: Title
    viewType: STANDALONE
  - code: PT_BODY
    name: Body
    viewType: GROUPED
  # the parts a citation is composed from (see the citation fixture): the
  # description itself, the fund it belongs to and that fund's information
  - code: PT_ARCH_DESC
    name: Archival description
    viewType: STANDALONE
  - code: PT_ARCH_DESC_FUND
    name: Archival fonds
    viewType: STANDALONE
  - code: PT_FUND_INFO
    name: Fonds information
    viewType: STANDALONE
itemTypes:
  - code: TITLE_MAIN
    name: Main title
    type: STRING
    indexed: true
  - code: UNIT_DATE
    name: Dating
    type: UNITDATE
    indexed: true
  # a second dating item type, so a facet spanning several of them has more than
  # one to span. Elasticsearch maps its fields from this model, so a fixture
  # using an item type declared nowhere here indexes on the embedded engine
  # (schemaless) and matches nothing on Elasticsearch
  - code: DATE_OTHER
    name: Other dating
    type: UNITDATE
    indexed: true
  # ENUM values arrive from Transfagent as display text (APUX ItemEnum is a plain
  # string, no code/label pair) - the terse values in these fixtures are just
  # short test data, not codes the portal would have to resolve.
  - code: LANG_CODE
    name: Language
    type: ENUM
    indexed: true
  - code: CNT_ITEMS
    name: Item count
    type: INTEGER
    indexed: true
  - code: REL_ENTITY
    name: Related entity
    type: APU_REF
    indexed: true
  - code: NOTE_SECRET
    name: Note excluded from the index
    type: STRING
    indexed: false
  - code: INT_NAME_INDEX
    name: Indexed name override
    type: STRING
    indexed: true
  - code: LINK_SOURCE
    name: Source link
    type: LINK
    indexed: false
  - code: NAME_ALT
    name: Variant name form
    type: STRING
    indexed: true
    nameVariant: true
  - code: NOTE_NOFT
    name: Indexed note excluded from the general fulltext
    type: STRING
    indexed: true
    fulltext: false
  # description items a citation is composed from. Their values are content the
  # source system delivers; the citation script names each code explicitly.
  - code: TITLE
    name: Title
    type: STRING
    indexed: true
  - code: UNIT_ID
    name: Reference code
    type: STRING
    indexed: true
  - code: INV_CISLO
    name: Inventory number
    type: STRING
    indexed: true
  - code: OTHERID_SIG
    name: Signature
    type: STRING
    indexed: true
  - code: OTHERID_CJ
    name: File number
    type: STRING
    indexed: true
  - code: STORAGE_ID
    name: Storage unit
    type: STRING
    indexed: true
  - code: CISLO_NAD
    name: Fonds number
    type: STRING
    indexed: true
  - code: INST_REF
    name: Institution
    type: APU_REF
    indexed: true
  - code: FUND_REF
    name: Archival fonds
    type: APU_REF
    indexed: true
  - code: FUND_INST_REF
    name: Institution of the fonds
    type: APU_REF
    indexed: true
metaDataTypes:
  - code: MD_ORDER
    name: Order
itemGroups:
  - code: GRP_TITLES
    items:
      - TITLE_MAIN
  - code: GRP_RELS
    items:
      - REL_ENTITY
