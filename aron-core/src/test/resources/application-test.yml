spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE,ORDER;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
  jpa:
    hibernate:
      # schema is owned by Liquibase (the real production changelog, run on H2)
      ddl-auto: none
    open-in-view: false
  liquibase:
    # Liquibase gets its own connection WITHOUT NON_KEYWORDS: its bookkeeping
    # queries need ORDER as a keyword, and it quotes the reserved-word columns it
    # creates (e.g. "order"). The app connection above keeps NON_KEYWORDS because
    # Hibernate references the order/value columns unquoted.
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    user: sa
    password: sa
# The embedded Lucene adapter replaces Elasticsearch in tests: the real startup
# bootstrap (SearchIndexManager) runs against it (in-memory directory - no
# search.lucene.path), and no test may depend on engine-specific behavior (that
# belongs to the es-it profile). The ES client bean still exists but never
# connects.
search:
  engine: lucene

# exercises the input-directory import (a supported data input) on every context
# startup with a minimal own-authored transfer
import:
  input-dir: ./src/test/resources/test-config/import

management:
  health:
    elasticsearch:
      enabled: false

types-config: ./src/test/resources/test-config/types.yaml
transformation-agent-url: "http://localhost:8088/ws/ApuTransformManager"

files:
  storage: ./target/test-data/fileStorage
  transfer:
    path: ./target/test-data/aronFileTransfer
  # referenced DAO files are served only from here; DaoServingTest also proves
  # a path outside this root is refused
  referenced-dirs: ./target/test-data/referencedFiles

tile:
  folder: ./target/test-data/tiles
  format: jpg

# the version is asserted by NewApiV1Test, so the suite exposes it
system:
  expose-version: true

webResources:
  pageTemplate: ./src/test/resources/test-config/pageTemplate.yaml
  news: ./src/test/resources/test-config/news.yaml
  favoriteQueries: ./src/test/resources/test-config/favoriteQueries.yaml
  facets: ./src/test/resources/test-config/searchConfig.yaml
  logo: ./src/test/resources/test-config/logo.svg
  topImage: ./src/test/resources/test-config/book.png
  resultLayout: ./src/test/resources/test-config/resultLayout.yaml
  # the SHIPPED citation configuration and script: their agreed wording is what
  # CitationTest pins, so the suite guards the deployment artifact itself
  citation: ../distribution/config/citation.yaml
  images: ./src/test/resources/test-config/images

help-url: http://help.test.example
