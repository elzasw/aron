# Display text of the general search's built-in facets (BuiltInFacets).
# Base bundle = English, the source language of the product; a language without
# its own file renders in it, as untranslated labels do.
#
# Keys are <facet>.label and the optional <facet>.description. Record-type
# names are not here: the search response carries no language, so a type
# bucket travels as its ApuType member and the client names it.

type.label=Record type

date.label=Dating
# A record can match a period it was only partly created in: the filter compares
# the record's whole dating span, which is the widest of its dates.
date.description=Records whose dating falls within the selected period. A record dated in several periods matches whenever any of them does.

related.label=Related to
related.description=Records that reference the chosen record, in any way.

