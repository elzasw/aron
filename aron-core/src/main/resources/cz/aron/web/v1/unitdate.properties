# Archival dating vocabulary - the part of a dating that CLDR does not cover.
# Base bundle = Czech, the source language of the display model; a language
# without its own file renders in it (as untranslated labels do).
#
#   century   {0} = century number
#   monthYear {0} = localized month name, {1} = year
#   estimated {0} = the formatted bound
#   range     {0} = lower side, {1} = upper side
#
# Confusable characters are written as escapes so they stay visible to whoever
# edits this file: \u00A0 = non-breaking space, \u2013 = en dash.

# Czech typography does not break the line between the ordinal and its word
century={0}.\u00A0stolet\u00ED
monthYear={0} {1}
estimated=[{0}]
# an interval separator is an en dash - neither a hyphen nor a minus sign
range={0}\u2013{1}
