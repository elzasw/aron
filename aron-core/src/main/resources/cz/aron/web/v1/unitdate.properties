# Archival dating vocabulary - the part of a dating that CLDR does not cover.
# Base bundle = English, the source language of the UI; a language without its
# own file renders in it (as untranslated labels do).
#
#   century   {0} = century number
#   monthYear {0} = localized month name, {1} = year
#   estimated {0} = the formatted bound
#   range     {0} = lower side, {1} = upper side
#
# Confusable characters are written as escapes so they stay visible to whoever
# edits this file: \u00A0 = non-breaking space, \u2013 = en dash.
#
# English ordinals have no JDK-provided rule (CLDR ordinal plural rules are not
# exposed), so the suffixes are spelled out here as a choice over the century
# number. Ascending limits: 1-3 take their own suffix, 4 covers 4-20 (all
# "th"), 21-23 take theirs again, 24 covers the rest. Datings beyond the 24th
# century are not a real case.
century={0,choice,1#1st|2#2nd|3#3rd|4#{0}th|21#21st|22#22nd|23#23rd|24#{0}th} century
monthYear={0} {1}
estimated=[{0}]
# an interval separator is an en dash - neither a hyphen nor a minus sign
range={0}\u2013{1}
