spring:
#  liquibase:
#    change-log: classpath:db/changelog/db.changelog.xml
  jpa:
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  # The old API lives under /api/aron as a MAPPING prefix (see WebConfig), not a
  # servlet context path - the URL root serves the UI (IndexController injects the
  # effective prefix into the SPA shell). Subpath deployment needs no rebuild: set
  # server.servlet.context-path (standalone) or send X-Forwarded-Prefix from the
  # reverse proxy; the framework strategy below folds the header into the context
  # path. The SOAP file-transfer endpoint (/cxf/*) is internal - the reverse proxy
  # must not forward /cxf/** from the internet.
  forward-headers-strategy: framework
  compression:
    enabled: true
    # The comma-separated list of mime types that should be compressed
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    # Compress the response only if the response size is at least 1KB
    min-response-size: 1024

