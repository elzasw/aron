---
openapi: 3.0.2
info:
  version: 1.0.0
  title: ARON Core Service API
servers:
  - url: https://localhost:3000/
tags:
  - name: Aron
  - name: Scripts
    description: Referenced files access API
  - name: File
    description: File download API
  - name: Redirect
    description: >-
      Permalink resolution and redirection. Implemented by the hand-written
      cz.aron.controller.RedirectApi using wildcard mappings, since permalinks
      may contain '/' characters that a single-segment path parameter cannot
      capture. Documented here for the API contract only.
paths:
  /test:
    get:
      tags:
        - Aron
      summary: test	
      description: ""
      operationId: test
      responses:
        "200":
          description: Success

  '/apu/{id}/entity':
    get:
      tags:
        - Aron
      summary: Get object with given id
      operationId: getApu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApuEntity'

  /apu/listview:
    post:
      tags:
        - Aron
      operationId: listView
      requestBody:
        content:
          application/json:
            schema:
              $ref: 'search-api.yaml#/components/schemas/Params'
        required: true
      responses:
        '200':
          description: default response
          content:
            'application/json':
              schema:
                $ref: 'search-api.yaml#/components/schemas/SimpleResult'

  /apu/listresults:
    post:
      tags:
        - Aron
      operationId: listResults
      requestBody:
        content:
          application/json:
            schema:
              $ref: 'search-api.yaml#/components/schemas/Params'
        required: true
      responses:
        '200':
          description: default response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/StructuredResults'

  /apu/listsimple:
    post:
      tags:
        - Aron
      operationId: listSimple
      requestBody:
        content:
          application/json:
            schema:
              $ref: 'search-api.yaml#/components/schemas/Params'
        required: true
      responses:
        '200':
          description: default response
          content:
            'application/json':
              schema:
                $ref: 'search-api.yaml#/components/schemas/SimpleResult'

  '/apu/views':
    get:
      tags:
        - Aron
      summary: Get views for given APU ids
      operationId: getViews
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/uuid'
          style: simple
          explode: false
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApuEntityView'

  '/apu/{id}/view':
    get:
      tags:
        - Aron
      summary: Get view for given APU id
      operationId: getView
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ApuEntityView'

  '/apu/{id}/related/{direction}':
    get:
      tags:
        - Aron
      summary: Get related nodes for given APU in specified direction
      operationId: getRelatedNodes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
        - name: direction
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApuEntityTreeViewDto'

  /apu/list:
    post:
      tags:
        - Aron
      summary: List objects satisfying given params
      operationId: list
      requestBody:
        content:
          application/json:
            schema:
              $ref: 'search-api.yaml#/components/schemas/Params'
        required: true
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                $ref: 'search-api.yaml#/components/schemas/SimpleResult'

  '/file/{id}':
    get:
      tags:
        - File
      summary: Download a digital object file by its ID
      description: Returns the content of the file in an input stream.
      operationId: downloadFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: The file was not found.

  '/redirect/{permalink}':
    get:
      tags:
        - Redirect
      summary: Resolve an APU permalink and redirect to the APU detail page
      description: >-
        The permalink may contain '/' characters. Returns 302 with a Location
        header pointing at /apu/{id}.
      operationId: redirect
      parameters:
        - name: permalink
          in: path
          required: true
          description: APU permalink (may contain slashes)
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the APU detail page
        '404':
          description: No APU found for the given permalink

  '/attachment/{name}':
    get:
      tags:
        - Redirect
      summary: Resolve an attachment name and redirect to its file download
      description: >-
        The name may contain '/' characters. Returns 302 with a Location header
        pointing at /api/aron/file/{fileId}.
      operationId: redirectAttachment
      parameters:
        - name: name
          in: path
          required: true
          description: Attachment name (may contain slashes)
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the attachment file
        '404':
          description: No, or more than one, attachment found for the given name

  '/redirectimage/{permalink}':
    get:
      tags:
        - Redirect
      summary: Resolve a digital object file permalink and redirect to the file within its APU
      description: >-
        The permalink may contain '/' characters. Returns 302 with a Location
        header pointing at /apu/{apuId}/dao/{daoId}/file/{fileId}.
      operationId: redirectImage
      parameters:
        - name: permalink
          in: path
          required: true
          description: Digital object file permalink (may contain slashes)
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the digital object file
        '404':
          description: No digital object file found for the given permalink

  '/script/{scriptName}/{id}':
    get:
      tags:
        - Scripts
      summary: Run script over given apu id
      description: Returns content generated by the script
      operationId: runApuScript
      parameters:
        - name: scriptName
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Not Modified
        '404':
          description: The file was not found.

components:
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Conditional request; returns 304 Not Modified when the entity tag matches.
      schema:
        type: string
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      required: false
      description: Conditional request; returns 304 Not Modified when the resource has not changed since the given date.
      schema:
        type: string
  schemas:
    uuid:
      type: string
      format: uuid
    ApuEntity:
      required:
        - id
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        result:
          type: string
        permalink:
          type: string
        order:
          type: integer
          format: int32
        published:
          type: boolean
        depth:
          type: integer
          format: int32
        pos:
          type: integer
          format: int32
        childCnt:
          type: integer
          format: int32
        indexed:
          type: boolean
        parent:
          $ref: '#/components/schemas/ApuEntity'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ApuPart'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ApuAttachment'
        digitalObjects:
          type: array
          items:
            $ref: '#/components/schemas/DigitalObject'
        type:
          type: string
          enum:
            - ARCH_DESC
            - COLLECTION
            - ENTITY
            - FINDING_AID
            - FUND
            - INSTITUTION
    ApuPart:
      required:
        - id
      type: object
      properties:
        id:
          type: string
        value:
          type: string
        type:
          type: string
        childParts:
          type: array
          items:
            $ref: '#/components/schemas/ApuPart'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApuPartItem'
    ApuPartItem:
      required:
        - id
      type: object
      properties:
        id:
          type: string
        value:
          type: string
        visible:
          type: boolean
        href:
          type: string
        type:
          type: string
        label:
          type: string
    DigitalObject:
      required:
        - id
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        permalink:
          type: string
        order:
          type: integer
          format: int32
        licenseCode:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/DigitalObjectFile'
    DigitalObjectFile:
      required:
        - id
      type: object
      properties:
        id:
          type: string
        permalink:
          type: string
        order:
          type: integer
          format: int32
        type:
          type: string
          enum:
            - PUBLISHED
            - THUMBNAIL
            - TILE
        file:
          $ref: '#/components/schemas/FileInfo'
        name:
          type: string
        referencedFile:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        selected:
          type: boolean
    FileInfo:
      required:
        - id
      type: object
      properties:
        id:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        permanent:
          type: boolean
    ApuAttachment:
      required:
        - id
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        order:
          type: integer
          format: int32
        file:
          $ref: '#/components/schemas/DigitalObjectFile'
    ApuEntityView:
      required:
        - id
        - name
        - order
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        order:
          type: integer
          format: int32
    ApuEntityTreeViewDto:
      required:
        - id
        - name
        - description        
        - depth
        - pos
        - childCnt
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        depth:
          type: integer
          format: int32
          nullable: false
        pos:
          type: integer
          format: int32
          nullable: false
        childCnt:
          type: integer
          format: int32
          nullable: false
    ResultRowItemValue:
      type: object
      required:
        - v
      properties:
        v:
          type: string
        id:
          type: string
    ResultRowItem:
      type: object
      required:
        - t
        - v
      properties:
        t:
          type: string
        v:
          type: array
          items:
            $ref: '#/components/schemas/ResultRowItemValue'
    StructuredResult:
      type: object
      required:
        - id
        - t
        - l
      properties:
        id:
          type: string
        t:
          type: string
        tn:
          description: >-
            Thumbnail: either an absolute URL or the name of a deployment-supplied
            image.
          type: string
        tn_link:
          description: >-
            Target of the thumbnail link; absent means the APU's own detail page.
            The snake_case name is the wire format Transfagent produces and the
            old UI reads - it must not be camel-cased.
          type: string
        l:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/ResultRowItem'
    StructuredResults:
      description: Structured results
      type: object
      allOf:
      - $ref: "#/components/schemas/ResultBase"
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StructuredResult'
