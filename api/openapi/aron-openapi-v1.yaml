openapi: 3.0.0
info:
  title: ARON Portal API
  version: "1.0"
  description: |-
    ARON portal API (v1) - the contract between the ARON backend and its user
    interface (and possible external consumers).

    Paths carry the full external prefix `/api/v1`; the application adds no
    further prefix. Clients resolve the base URL from the page's
    `window.serverContextPath` (injected by the server into the SPA shell), so the
    same UI build works at the URL root and under a subpath.

    The contract deliberately exposes no search-engine internals - search and
    facet models are typed DTOs, so the indexing backend can evolve or be swapped
    without breaking clients.
tags:
  - name: system
  - name: ui
  - name: search
  - name: apu
paths:
  /api/v1/apu/search:
    post:
      operationId: Search_search
      description: |-
        Searches APUs of one type. Facet results follow multi-select semantics:
        bucket counts of a facet reflect the query and all filters EXCEPT that
        facet's own VALUES filter, and dating bounds of a UNITDATE facet ignore
        that facet's own RANGE filter - so an active selection can always be
        widened.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApuSearchResponse"
      tags:
        - search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApuSearchRequest"
  /api/v1/apu/{uuid}:
    get:
      operationId: Apu_getDetail
      description: |-
        Detail of one APU. Supports conditional requests: responses carry
        `ETag`/`Last-Modified`, and a request with `If-None-Match` /
        `If-Modified-Since` is answered with 304 when unchanged.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          headers:
            ETag:
              required: false
              schema:
                type: string
            Last-Modified:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApuDetail"
        "304":
          description: The client has made a conditional request and the resource has not been modified.
      tags:
        - apu
  /api/v1/apu/{uuid}/tree:
    get:
      operationId: Apu_getTreeNodes
      description: |-
        One window of the archival-description tree around an APU - the source of
        the incremental tree navigation. `BEFORE`/`AFTER` return up to a
        server-configured window of siblings preceding/following the APU in tree
        order; `UNDER` returns the first window of its children. Conditional
        requests behave as in `getDetail`.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: direction
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TreeDirection"
          explode: false
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          headers:
            ETag:
              required: false
              schema:
                type: string
            Last-Modified:
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreeNode"
        "304":
          description: The client has made a conditional request and the resource has not been modified.
      tags:
        - apu
  /api/v1/facets:
    get:
      operationId: Search_getFacets
      description: |-
        Typed facet definitions of one section, in the deployment-configured
        order. Labels are server-localized (deployment configuration is the
        label source).
      parameters:
        - name: apuType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ApuType"
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FacetDef"
      tags:
        - search
  /api/v1/facets/{code}/options:
    post:
      operationId: Search_getFacetOptions
      description: |-
        Options of one enumerated facet (ENUM/MULTI_REF) for its picker - the
        type-ahead companion of `search`. The same multi-select semantics apply:
        the request's query and filters constrain the options EXCEPT the facet's
        own VALUES filter. `q` narrows options by their display label (label of
        a reference, the value itself of an ENUM): diacritics-insensitive, all
        words must match with the last one as a prefix. Facets of other kinds
        (FULLTEXT, UNITDATE) have no options - 400.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacetOptionsResponse"
      tags:
        - search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacetOptionsRequest"
  /api/v1/system/info:
    get:
      operationId: System_getInfo
      description: Basic information about the running application.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
      tags:
        - system
  /api/v1/ui/config:
    get:
      operationId: Ui_getConfig
      description: "UI configuration: portal name, available localizations, top-level menu."
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UiConfig"
      tags:
        - ui
  /api/v1/ui/logo:
    get:
      operationId: Ui_getLogo
      description: Portal logo image (deployment-supplied; format varies, see Content-Type).
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
      tags:
        - ui
components:
  schemas:
    ApuDetail:
      type: object
      required:
        - uuid
        - name
        - apuType
        - childCount
        - treePath
        - parts
        - attachments
        - digitalObjects
      properties:
        uuid:
          type: string
        name:
          type: string
          description: Display name.
        description:
          type: string
        apuType:
          $ref: "#/components/schemas/ApuType"
        permalink:
          type: string
          description: Public permalink of this APU, when assigned.
        childCount:
          type: integer
          format: int32
          description: Number of child APUs in the archival-description tree (0 = leaf).
        treePath:
          type: array
          items:
            $ref: "#/components/schemas/TreeNode"
          description: |-
            The APU's path in the archival-description tree, root first, INCLUDING
            the APU itself as the last element - a single element for root or
            standalone APUs. Drives both the breadcrumb navigation (all but the last
            element) and the seed of the incremental tree (`getTreeNodes`).
        parts:
          type: array
          items:
            $ref: "#/components/schemas/DetailPart"
          description: Display-ready parts in display order; parts with no visible items are omitted.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentInfo"
          description: Attachments (metadata only; binary serving arrives with a later slice).
        digitalObjects:
          type: array
          items:
            $ref: "#/components/schemas/DigitalObjectInfo"
          description: Digital objects (metadata only; file/tile serving arrives with a later slice).
      description: Display-ready detail of one APU (the render model).
    ApuLink:
      type: object
      required:
        - uuid
        - name
      properties:
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
      description: Reference to another APU, resolved with its display data.
    ApuSearchItem:
      type: object
      required:
        - uuid
        - name
        - apuType
        - containsDigitalObjects
      properties:
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
        apuType:
          $ref: "#/components/schemas/ApuType"
        containsDigitalObjects:
          type: boolean
      description: One search hit.
    ApuSearchRequest:
      type: object
      properties:
        apuType:
          allOf:
            - $ref: "#/components/schemas/ApuType"
          description: Section restriction; unset = search across all types (general search, no facets).
        query:
          type: string
          description: Fulltext query over the APU name and description; unset = match all.
        filters:
          type: array
          items:
            $ref: "#/components/schemas/SearchFilter"
          description: Active filters; each references a facet of the section by its code.
        from:
          type: integer
          format: int32
          minimum: 0
          description: |-
            Zero-based offset of the first returned item. `from + size` must stay
            within the server's page window (default 10 000); beyond it the request
            is rejected (400).
          default: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Page size.
          default: 10
        sort:
          allOf:
            - $ref: "#/components/schemas/SortMode"
          default: AUTO
        totalUpTo:
          type: integer
          format: int32
          minimum: 1
          description: |-
            Requested accuracy of `total`: matching APUs are counted exactly up to
            this value (see `totalRelation`). Unset = the server default (10 000);
            the server clamps the value to its configured maximum.
      description: Search request over APUs.
    ApuSearchResponse:
      type: object
      required:
        - total
        - totalRelation
        - queryMode
        - items
        - facets
        - typeCounts
      properties:
        total:
          type: integer
          format: int64
          description: |-
            Total number of matching APUs (independent of paging), counted exactly
            up to the effective accuracy limit — `totalRelation` says whether it is
            exact.
        totalRelation:
          allOf:
            - $ref: "#/components/schemas/TotalRelation"
          description: EQ = `total` is exact; GTE = at least `total` APUs match.
        queryMode:
          allOf:
            - $ref: "#/components/schemas/QueryMode"
          description: |-
            STRICT = every query word had to match. RELAXED = the strict query had no
            hits and the server automatically retried with any-word matching - the UI
            labels such results.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApuSearchItem"
        facets:
          type: array
          items:
            $ref: "#/components/schemas/FacetResult"
          description: |-
            Per-facet results of the section (multi-select semantics), each shaped by
            its facet kind - see the `FacetResult` specializations. A facet's full
            option list (beyond the bucket limit) comes from `getFacetOptions`.
        typeCounts:
          type: array
          items:
            $ref: "#/components/schemas/TypeCount"
          description: |-
            Matching APUs per type, count descending. The query and all filters
            apply; the request's own `apuType` restriction does NOT - a user browsing
            one section still sees the other sections' counts and can switch there.
      description: Search response.
    ApuType:
      type: string
      enum:
        - ARCH_DESC
        - COLLECTION
        - ENTITY
        - FINDING_AID
        - FUND
        - INSTITUTION
      description: Types of archival presentation units.
    AttachmentInfo:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Display name.
        file:
          allOf:
            - $ref: "#/components/schemas/FileInfo"
          description: The attachment's file.
      description: Attachment of an APU (metadata; binary serving arrives with a later slice).
    DatingBounds:
      type: object
      required:
        - minYear
        - maxYear
      properties:
        minYear:
          type: integer
          format: int32
        maxYear:
          type: integer
          format: int32
      description: |-
        Year bounds of the matching documents' dating - the range of a UNITDATE
        facet's slider. Computed with the facet's own RANGE filter excluded
        (multi-select), so the user can widen a selected range.
    DatingFacetResult:
      type: object
      properties:
        bounds:
          allOf:
            - $ref: "#/components/schemas/DatingBounds"
          description: Absent when no matching document carries a dating.
      allOf:
        - $ref: "#/components/schemas/FacetResult"
      description: Dating bounds of a UNITDATE facet.
    DetailItem:
      type: object
      required:
        - code
        - label
        - kind
        - value
      properties:
        code:
          type: string
          description: Item-type code (display-model code, tilde form) - lets clients special-case known types.
        label:
          type: string
          description: Server-localized display label.
        kind:
          $ref: "#/components/schemas/DetailItemKind"
        value:
          type: string
          description: Display value; datings arrive formatted server-side, kind JSON carries the raw JSON string.
        href:
          type: string
          description: Link target (kind LINK; `value` is the caption).
        ref:
          allOf:
            - $ref: "#/components/schemas/ApuLink"
          description: Referenced APU (kind REF).
      description: One display-ready item of a part.
    DetailItemKind:
      type: string
      enum:
        - TEXT
        - LINK
        - REF
        - JSON
      description: Item value kinds - how the client renders the value.
    DetailPart:
      type: object
      required:
        - code
        - label
        - viewType
        - items
      properties:
        code:
          type: string
          description: Part-type code (display-model code, tilde form).
        label:
          type: string
          description: Server-localized display label.
        viewType:
          $ref: "#/components/schemas/PartViewType"
        value:
          type: string
          description: Textual value of the whole part, when the source supplied one.
        items:
          type: array
          items:
            $ref: "#/components/schemas/DetailItem"
          description: Display-ready items in display order (invisible items already filtered out).
      description: One display-ready part of the detail.
    DigitalObjectInfo:
      type: object
      required:
        - uuid
        - files
      properties:
        uuid:
          type: string
        name:
          type: string
        permalink:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileInfo"
          description: Files of the object in display order.
      description: Digital object (digitized attachment) of an APU.
    EnumFacetResult:
      type: object
      required:
        - buckets
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
      allOf:
        - $ref: "#/components/schemas/FacetResult"
      description: Value buckets of an ENUM facet (`value` doubles as the display label).
    FacetBucket:
      type: object
      required:
        - value
        - count
      properties:
        value:
          type: string
          description: Filter value to send back in a VALUES filter (for references the APU uuid).
        label:
          type: string
          description: Display label when it differs from the value (e.g. resolved references).
        count:
          type: integer
          format: int64
      description: One value bucket of an enumerated facet.
    FacetDef:
      type: object
      required:
        - code
        - type
        - label
        - display
      properties:
        code:
          type: string
          description: Facet code = source item-type code (tilde form, e.g. `LANG~CODE`); used in filters.
        type:
          $ref: "#/components/schemas/FacetType"
        label:
          type: string
          description: Display label (server-localized).
        tooltip:
          type: string
        description:
          type: string
        display:
          $ref: "#/components/schemas/FacetDisplay"
        orderBy:
          allOf:
            - $ref: "#/components/schemas/FacetOrder"
          description: Bucket ordering (ENUM facets).
        displayedItems:
          type: integer
          format: int32
          description: Buckets shown collapsed (ENUM facets); more after expanding.
        maxDisplayedItems:
          type: integer
          format: int32
          description: Bucket limit when expanded (ENUM facets); unset = no limit.
      description: Definition of one search facet (deployment-configured).
    FacetDisplay:
      type: string
      enum:
        - ALWAYS
        - DETAIL
      description: When the facet is offered.
    FacetOptionsRequest:
      type: object
      required:
        - apuType
      properties:
        apuType:
          allOf:
            - $ref: "#/components/schemas/ApuType"
          description: Section whose facet configuration applies (facets are section-scoped).
        query:
          type: string
          description: Fulltext query of the current search; unset = match all.
        filters:
          type: array
          items:
            $ref: "#/components/schemas/SearchFilter"
          description: Active filters of the current search; the facet's own VALUES filter is ignored.
        q:
          type: string
          description: Type-ahead text matched against option labels; unset = all options (up to `size`).
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: Maximum number of returned options.
          default: 100
      description: Options request of one facet - carries the active search state.
    FacetOptionsResponse:
      type: object
      required:
        - options
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
      description: "Facet options, ordered per the facet configuration (default: count descending)."
    FacetOrder:
      type: string
      enum:
        - FREQ
        - ASC
      description: Ordering of enumerated facet buckets.
    FacetResult:
      type: object
      required:
        - kind
        - code
      properties:
        kind:
          allOf:
            - $ref: "#/components/schemas/FacetResultKind"
          description: Result kind - the discriminator; follows the facet's type.
        code:
          type: string
          description: Facet code.
      discriminator:
        propertyName: kind
        mapping:
          ENUM: "#/components/schemas/EnumFacetResult"
          REF: "#/components/schemas/RefFacetResult"
          DATING: "#/components/schemas/DatingFacetResult"
      description: |-
        Result of one facet, discriminated by `kind` - each facet kind carries only
        the fields it really has (same TypeSpec pattern as `SearchFilter`).
    FacetResultKind:
      type: string
      enum:
        - ENUM
        - REF
        - DATING
      description: Facet result kinds - the FacetResult discriminator (follows the facet's type).
    FacetType:
      type: string
      enum:
        - FULLTEXT
        - ENUM
        - MULTI_REF
        - UNITDATE
        - MULTI_REF_EXT
        - MULTI_TYPE_REF
      description: Facet kinds (mirrors the searchConfig.yaml model).
    FileInfo:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: File id for the (future) file-serving endpoints.
        fileType:
          allOf:
            - $ref: "#/components/schemas/FileType"
          description: Role of the file within its digital object.
        name:
          type: string
        contentType:
          type: string
          description: MIME type.
        size:
          type: integer
          format: int64
          description: Size in bytes.
        selected:
          type: boolean
          description: The file a viewer should open first.
      description: One file of a digital object or attachment.
    FileType:
      type: string
      enum:
        - PUBLISHED
        - THUMBNAIL
        - TILE
      description: Roles of digital-object files.
    FilterKind:
      type: string
      enum:
        - VALUES
        - TEXT
        - RANGE
      description: Filter kinds - the SearchFilter discriminator.
    MenuItem:
      type: object
      required:
        - code
      properties:
        code:
          allOf:
            - $ref: "#/components/schemas/MenuItemCode"
          description: Section code; the UI maps it to its route and localized label.
        color:
          type: string
          description: Accent color of the section (CSS color); the UI supplies a default palette.
        url:
          type: string
          description: External URL - the item is a plain link instead of an in-app section (typically HELP or NEWS).
      description: One item of the top-level menu.
    MenuItemCode:
      type: string
      enum:
        - INSTITUTION
        - FUND
        - FINDING_AID
        - ARCH_DESC
        - ENTITY
        - ORIGINATOR
        - NEWS
        - HELP
      description: Portal sections available for the top-level menu.
    PartViewType:
      type: string
      enum:
        - STANDALONE
        - GROUPED
      description: How a part is displayed (the display model's viewType).
    QueryMode:
      type: string
      enum:
        - STRICT
        - RELAXED
      description: How the fulltext query was matched (see `ApuSearchResponse.queryMode`).
    RangeFilter:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
      allOf:
        - $ref: "#/components/schemas/SearchFilter"
      description: |-
        Dating filter of a UNITDATE facet: matches documents whose interval
        intersects [from, to]. Bounds accept a year (`1190`), a date (`1190-05-01`)
        or a full ISO date-time; either bound may be omitted.
    RefFacetResult:
      type: object
      required:
        - buckets
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
      allOf:
        - $ref: "#/components/schemas/FacetResult"
      description: "Reference buckets of a MULTI_REF facet: `value` = APU uuid, `label` = display name."
    SearchFilter:
      type: object
      required:
        - kind
        - facet
      properties:
        kind:
          allOf:
            - $ref: "#/components/schemas/FilterKind"
          description: |-
            Filter kind - the discriminator. A named enum so the base and every
            subtype share one type.
        facet:
          type: string
          description: Code of the facet the filter applies to.
      discriminator:
        propertyName: kind
        mapping:
          VALUES: "#/components/schemas/ValuesFilter"
          TEXT: "#/components/schemas/TextFilter"
          RANGE: "#/components/schemas/RangeFilter"
      description: |-
        One active filter, discriminated by `kind`. TypeSpec requires every subtype
        to re-declare the discriminator literal; the emitted OpenAPI is post-processed
        (scripts/strip-discriminator-redeclaration.mjs) into the classic
        parent-only-property shape that code generators handle (CAM pattern).
    SortMode:
      type: string
      enum:
        - AUTO
        - RELEVANCE
        - NAME
        - NAME_DESC
        - DATE_ASC
        - DATE_DESC
      description: |-
        Named sort modes. Every mode tie-breaks deterministically (name, then uuid),
        so paging is stable. Records without the sorted value (no name, no dating)
        always sort last.
    SystemInfo:
      type: object
      required:
        - name
        - version
      properties:
        name:
          type: string
          description: Application name.
        version:
          type: string
          description: Application version (build version; "dev" when built without build info).
      description: Basic information about the running application.
    TextFilter:
      type: object
      required:
        - q
      properties:
        q:
          type: string
      allOf:
        - $ref: "#/components/schemas/SearchFilter"
      description: Text filter of a FULLTEXT facet (analyzed match on the facet's field).
    TotalRelation:
      type: string
      enum:
        - EQ
        - GTE
      description: Accuracy of a search response's `total`.
    TreeDirection:
      type: string
      enum:
        - BEFORE
        - AFTER
        - UNDER
      description: Directions of the incremental tree navigation.
    TreeNode:
      type: object
      required:
        - uuid
        - name
        - depth
        - pos
        - childCount
      properties:
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
          description: Tree nodes display `description` when present, `name` otherwise.
        depth:
          type: integer
          format: int32
          description: Depth within the tree (relative; larger = deeper).
        pos:
          type: integer
          format: int32
          description: 1-based position among the node's siblings.
        childCount:
          type: integer
          format: int32
          description: Number of children (0 = leaf).
      description: One node of the archival-description tree.
    TypeCount:
      type: object
      required:
        - apuType
        - count
      properties:
        apuType:
          $ref: "#/components/schemas/ApuType"
        count:
          type: integer
          format: int64
      description: Number of matching APUs of one type.
    UiConfig:
      type: object
      required:
        - name
        - localizations
        - menuItems
      properties:
        name:
          type: string
          description: Portal name displayed in the header and the browser tab.
        localizations:
          type: array
          items:
            type: string
          description: |-
            Available localizations (IETF-like codes, e.g. `cs_CZ`). The UI offers a
            language switcher only when more than one is listed.
        menuItems:
