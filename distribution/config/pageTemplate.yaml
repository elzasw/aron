# Vychozi ceska konfigurace portalu. Nasazeni tento soubor prepisuje svym -
# nazvem, nabidkou a odkazy v paticce.

# Nazev nasazeni. Server jej vklada do stranky jeste pred spustenim skriptu,
# takze je spravny uz pri prvnim vykresleni (zalozka prohlizece i zahlavi).
name: Archiv online

# Dostupne prekladatelne jazyky nasazeni. Prepinac jazyka se nabizi jen tam, kde
# je jazyku vic; ctenar si vybira sam a volba se pamatuje. Prvni polozka je
# vychozi jazyk nasazeni. Regiony se pri parovani ignoruji, takze cs_CZ obslouzi
# i ctenare s cs.
localizations:
  - cs_CZ
  - en

# Nabidka portalu. Klic zde zamerne neni: bez nej plati vychozi nabidka portalu -
# archivni soubory, archivalie, archivni entity a napoveda (ta jen tehdy, kdyz je
# nastaven help-url). Archivni pomucky, puvodci, archivy a aktuality jsou ve
# vychozim stavu vypnute; nasazeni, ktere je publikuje, si nabidku vypise cele:
#
#menu:
#  - code: FUND
#  - code: ARCH_DESC
#  - code: FINDING_AID     # archivni pomucky
#  - code: ENTITY
#  - code: ORIGINATOR      # puvodci
#  - code: INSTITUTION     # archivy
#  - code: NEWS            # aktuality
#  - code: HELP
#
# Sekce, ktera v nabidce neni, prestava byt videt, ale jeji adresa dal funguje -
# nabidka ridi viditelnost, ne existenci sekce. Barvu polozky lze pridat klicem
# color, bez nej plati vychozi paleta portalu (odpovida barvam stareho portalu).

# Hlavni barva portalu. Klic zde neni: bez nej plati vychozi paleta portalu
# (odpovida staremu portalu). Nasazeni, ktere ma vlastni barvu, uvede oba odstiny
# - tmavsi nese zahlavi, svetlejsi aktivni polozku nabidky a plochu pod ikonou
# zaznamu ve vysledcich:
#
#primaryColor:
#  dark: hsl(272, 14%, 21%)
#  main: hsl(272, 14%, 31%)
#
# Barvu server vklada uz do stranky, takze plati pri prvnim vykresleni. Za
# kontrast bileho textu na tehle barve odpovida nasazeni (WCAG 2.1 AA zada 4,5:1
# pro bezny text) - viz doc/accessibility.md.

# Odkazy v paticce - stranky, ktere nasazeni publikuje. Znama role (code) se
# popise sama v jazyce ctenare, volny odkaz ma label (jeden retezec, nebo mapu
# jazyk -> text). Prohlaseni o pristupnosti je pro organy verejne spravy
# povinnost (zakon c. 99/2019 Sb.) - viz doc/accessibility.md.
#
# Prazdna paticka je legitimni: portal vlozeny do stranek zrizovatele necha
# paticku na hostiteli. Nasazeni proto tyto odkazy nahradi vlastnimi, nebo je
# odstrani.
footer:
  links:
    - code: ACCESSIBILITY
      url: https://example.org/pristupnost
    - url: https://example.org/kontakt
      label:
        cs: Kontakt
        en: Contact

# Uvodni strana portalu - pripravene vstupy pro ctenare, ktery jeste nic
# nenapsal ("Mohlo by vas zajimat" stareho portalu). Klic je volitelny: bez nej
# je na uvodni strane jen vyhledavaci pole.
#
# Kazda skupina ma nazev (label), zpusob zobrazeni (style) a dlazdice (tiles):
#   LIST - radky odkazu; vhodne pro delsi seznam
#   GRID - obrazkove dlazdice v mrizce; dlazdice bez obrazku nese hlavni barvu
#          portalu. Bez klice style plati LIST.
#
# Dlazdice vede bud VEN z portalu (url - absolutni http(s) nebo mailto), nebo DO
# vyhledavani jedne sekce (apuType + volitelne query a filters) - nikdy oboji.
# Filtry se zapisuji stejnym slovnikem jako searchConfig.yaml (facet se jmenuje
# podle prvku popisu, podtrzitka jako tam); druh filtru se dovozuje z typu
# fazety, takze se nemuze rozejit s konfiguraci vyhledavani. Chybna fazeta
# zastavi start serveru - dlazdice, kterou server neumi obslouzit, by ctenare
# zavedla na chybovou stranku.
#
# label a note lze zapsat jednim retezcem (zdrojovy jazyk), nebo mapou
# jazyk -> text. Volitelny obrazek se jmenuje jmenem souboru z adresare
# webResources.resultImages (positionX/positionY posunou vyrez u fotografie,
# columnSpan/rowSpan roztahnou dlazdici v mrizce na 2 pole).
#
# Obrazky home-*.svg v config/images/results jsou ZASTUPNE, jako logo.svg
# a topImage.png: nakres misto fotografie, aby bylo videt, co dlazdice umi.
# Nasazeni je vymeni za vlastni grafiku (stejna jmena = zadna zmena tohoto
# souboru), nebo klic image smaze. Za citelnost bileho popisu na vlastni
# fotografii odpovida nasazeni - viz doc/accessibility.md.
#
# Hodnoty filtru jsou data: co v datech nasazeni neni, nic nenajde - seznam
# nize miri na druhy archivalii, ktere badatele hledaji nejcasteji.
homepage:
  groups:
    - label:
        cs: Mohlo by vás zajímat
        en: You might be interested in
      style: GRID
      tiles:
        # Prvni dlazdice je "hero" pres 2x2 pole. Obrazek je zastupny (home-*.svg
        # v adresari images/results, viz nize) - nasazeni jej vymeni za vlastni
        # fotografii, nebo klic image smaze a dlazdice pak nese hlavni barvu.
        - label: { cs: Matriky, en: Parish registers }
          image: { name: home-matriky.svg }
          columnSpan: 2
          rowSpan: 2
          apuType: ARCH_DESC
          filters:
            - facet: UNIT_TYPE
              values: [matrika]
        - label: { cs: Kroniky, en: Chronicles }
          note: { cs: úřední i neúřední kroniky, en: official and unofficial chronicles }
          image: { name: home-kroniky.svg }
          columnSpan: 2
          apuType: ARCH_DESC
          filters:
            - facet: UNIT_TYPE
              values: [kronika]
        - label: { cs: Mapy a plány, en: Maps and plans }
          # vyrez: subjekt lezi vlevo dole, proto se drzi tam
          image: { name: home-mapy.svg, positionX: left, positionY: bottom }
          columnSpan: 2
          apuType: ARCH_DESC
          filters:
            - facet: UNIT_TYPE
              values: [mapa]
        # Bez klice image: dlazdice nese hlavni barvu portalu, takze skupina
        # drzi tvar i tam, kde nasazeni obrazky nedoda.
        - label: { cs: Evidence nemovitostí, en: Property records }
          note: { cs: pozemkové knihy, gruntovní knihy, en: land registers }
          columnSpan: 2
          apuType: ARCH_DESC
          filters:
            - facet: UNIT_TYPE
              values: [evidence nemovitostí]
        - label: { cs: Evidence obyvatel, en: Population records }
          note:
            cs: seznamy obyvatel, soupisy duší, sčítací operáty, urbáře
            en: population lists, censuses, urbaria
          columnSpan: 2
          apuType: ARCH_DESC
          filters:
            - facet: UNIT_TYPE
              values: [evidence obyvatel]
        - label: { cs: Archiválie s digitalizáty, en: Records with digitised images }
          image: { name: home-fotografie.svg, positionY: top }
          columnSpan: 2
          apuType: ARCH_DESC
          filters:
            - facet: DIGITAL
              values: [Ano]

  # Pas na konci uvodni strany - kdo portal provozuje, co zpristupnuje a kam se
  # obratit. Zamerne jen na uvodni strance: ram aplikace je vysoky jednu
  # obrazovku a kazdy jeho radek ubira z obsahu, takze pas na kazde strance by
  # natrvalo zmensil panely detailu zaznamu. Povinne odkazy (prohlaseni o
  # pristupnosti) zustavaji v paticce ramu, kde jsou videt vsude - viz
  # footer.links vyse.
  #
  # Sloupec ma volitelny nadpis (heading), odstavce (paragraphs) a odkazy
  # (links); prose je vzdy pred odkazy. Odkaz uvnitr vety se zapisuje
  # zastupnym jmenem {jmeno} a doplni se v links daneho odstavce - proto
  # neni potreba zadne HTML a portal vykresluje jen odkazy, ktere sam ridi.
  # Zastupne jmeno se musi vyskytovat v kazde jazykove variante textu, jinak
  # se server nespusti.
  footer:
    columns:
      - heading:
          cs: Základní informace
          en: About
        paragraphs:
          - text:
              cs: "Prezentační web Archiv online je webová aplikace {archiv} sloužící ke zpřístupnění popisu archiválií a jejich digitalizátů."
              en: "Archives online is a web application of the {archiv}, presenting archival descriptions and their digitised images."
            links:
              archiv:
                label:
                  cs: Státního oblastního archivu
                  en: State Regional Archives
                url: https://example.org
          - text:
              cs: "© 2026 Státní oblastní archiv"
              en: "© 2026 State Regional Archives"
      - heading:
          cs: Kontakt
          en: Contact
        links:
          - label: badatelna@example.org
            url: "mailto:badatelna@example.org"
          - label:
              cs: Webové stránky archivu
              en: The archive's website
            url: https://example.org
          # Odkaz muze nest malou znacku, po ktere ho ctenar pozna (profil na
          # socialni siti). Znacka je soubor z adresare webResources.resultImages,
          # ne jmeno, ktere by znal portal - proto se prejmenovani znacky
          # (z Twitteru se stalo X) resi vymenou souboru a nova sit pridanim
          # dalsiho. Popis (label) zustava jmenem odkazu i pro cteni hlasem,
          # takze znacka nikdy nenese vyznam sama:
          #
          #- label: Facebook
          #  url: https://facebook.com/archiv
          #  image: { name: facebook.svg }
