# Vychozi ceska konfigurace portalu. Nasazeni tento soubor prepisuje svym -
# nazvem, nabidkou a odkazy v paticce.

# Nazev nasazeni. Server jej vklada do stranky jeste pred spustenim skriptu,
# takze je spravny uz pri prvnim vykresleni (zalozka prohlizece i zahlavi).
name: Archiv online

# Dostupne prekladatelne jazyky nasazeni. Prepinac jazyka se nabizi jen tam, kde
# je jazyku vic; ctenar si vybira sam a volba se pamatuje. Prvni polozka je
# vychozi jazyk nasazeni. Regiony se pri parovani ignoruji, takze cs_CZ obslouzi
# i ctenare s cs.
localizations:
  - cs_CZ
  - en

# Nabidka portalu. Klic zde zamerne neni: bez nej plati vychozi nabidka portalu -
# archivni soubory, archivalie, archivni entity a napoveda (ta jen tehdy, kdyz je
# nastaven help-url). Archivni pomucky, puvodci, archivy a aktuality jsou ve
# vychozim stavu vypnute; nasazeni, ktere je publikuje, si nabidku vypise cele:
#
#menu:
#  - code: FUND
#  - code: ARCH_DESC
#  - code: FINDING_AID     # archivni pomucky
#  - code: ENTITY
#  - code: ORIGINATOR      # puvodci
#  - code: INSTITUTION     # archivy
#  - code: NEWS            # aktuality
#  - code: HELP
#
# Sekce, ktera v nabidce neni, prestava byt videt, ale jeji adresa dal funguje -
# nabidka ridi viditelnost, ne existenci sekce. Barvu polozky lze pridat klicem
# color, bez nej plati vychozi paleta portalu (odpovida barvam stareho portalu).

# Hlavni barva portalu. Klic zde neni: bez nej plati vychozi paleta portalu
# (odpovida staremu portalu). Nasazeni, ktere ma vlastni barvu, uvede oba odstiny
# - tmavsi nese zahlavi, svetlejsi aktivni polozku nabidky a plochu pod ikonou
# zaznamu ve vysledcich:
#
#primaryColor:
#  dark: hsl(272, 14%, 21%)
#  main: hsl(272, 14%, 31%)
#
# Barvu server vklada uz do stranky, takze plati pri prvnim vykresleni. Za
# kontrast bileho textu na tehle barve odpovida nasazeni (WCAG 2.1 AA zada 4,5:1
# pro bezny text) - viz doc/accessibility.md.

# Odkazy v paticce - stranky, ktere nasazeni publikuje. Znama role (code) se
# popise sama v jazyce ctenare, volny odkaz ma label (jeden retezec, nebo mapu
# jazyk -> text). Prohlaseni o pristupnosti je pro organy verejne spravy
# povinnost (zakon c. 99/2019 Sb.) - viz doc/accessibility.md.
#
# Prazdna paticka je legitimni: portal vlozeny do stranek zrizovatele necha
# paticku na hostiteli. Nasazeni proto tyto odkazy nahradi vlastnimi, nebo je
# odstrani.
footer:
  links:
    - code: ACCESSIBILITY
      url: https://example.org/pristupnost
    - url: https://example.org/kontakt
      label:
        cs: Kontakt
        en: Contact
