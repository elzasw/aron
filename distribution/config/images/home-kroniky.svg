       for its own photographs. -->
  <rect width="400" height="300" fill="#3c2f28"/>
  <g>
    <rect x="20" y="40" width="52" height="230" fill="#6b3b2e"/>
    <rect x="78" y="60" width="44" height="210" fill="#4f5a3a"/>
    <rect x="128" y="30" width="58" height="240" fill="#7a5a2e"/>
    <rect x="192" y="70" width="40" height="200" fill="#5a3a44"/>
    <rect x="238" y="45" width="54" height="225" fill="#3f4f5a"/>
    <rect x="298" y="65" width="46" height="205" fill="#6b5330"/>
    <rect x="350" y="35" width="34" height="235" fill="#4a3a30"/>
  </g>
  <!-- gilt bands on the spines -->
  <g stroke="#d9b877" stroke-opacity="0.7" stroke-width="3">
    <path d="M24 90h44M82 108h36M132 82h50M196 116h32M242 96h46M302 112h38M354 88h26"/>
